name: Chinese build

# main 保存工具和翻译缓存；zh 的内容每轮从干净上游重新生成。
# 比较远端 zh 的 tree，构建和滚动发布始终使用同一个不可变 generated_sha。
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      build_apk:
        description: Build APKs after translating
        type: boolean
        default: true
      force_retranslate:
        description: Ignore the cache and retranslate every string
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "tools/i18n/**"
      - "i18n/**"
      - ".github/workflows/i18n.yml"

concurrency:
  group: chinese-build
  cancel-in-progress: true

permissions:
  contents: write

env:
  UPSTREAM_REPO: FaFre/WebLibre
  UPSTREAM_BRANCH: main
  OUTPUT_BRANCH: zh
  FLUTTER_VERSION: "3.47.0"
  MELOS_VERSION: "7.8.1"
  GO_VERSION: "1.25.x"
  NODE_VERSION: "20"
  MIN_COVERAGE: "50"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  translate:
    runs-on: ubuntu-latest
    outputs:
      upstream_sha: ${{ steps.upstream.outputs.sha }}
      generated_sha: ${{ steps.push_zh.outputs.generated_sha }}
      changed: ${{ steps.push_zh.outputs.changed }}
      coverage: ${{ steps.translate.outputs.coverage }}
    steps:
      - name: Checkout tooling snapshot
        uses: actions/checkout@v4
        with:
          # 默认检出触发本次 CI 的提交，不追随运行期间移动的 main。
          fetch-depth: 0

      - name: Fetch upstream
        id: upstream
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null || true
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"
          sha="$(git rev-parse "upstream/${UPSTREAM_BRANCH}")"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Upstream ${UPSTREAM_REPO}@${UPSTREAM_BRANCH} is ${sha:0:12}"

      - name: Create a pristine upstream worktree and restore translation cache
        run: |
          set -euo pipefail
          git worktree add --detach ../zh "upstream/${UPSTREAM_BRANCH}"
          mkdir -p ../zh/i18n
          # 只从 main 读取词条缓存；manifest 和报告必须由本轮上游重新生成。
          if git cat-file -e origin/main:i18n/zh.json 2>/dev/null; then
            git show origin/main:i18n/zh.json > ../zh/i18n/zh.json
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.13.3"

      - name: Install official Dart AST dependencies
        working-directory: tools/i18n/dart_ast
        run: dart pub get --enforce-lockfile

      - name: Install translation engine
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # 固定已使用的稳定版，避免每日任务因上游依赖漂移突然失效。
          python -m pip install "argostranslate==1.11.0"

      - name: Run toolchain tests including Dart kernel compilation
        run: python tools/i18n/test_i18n.py

      - name: Test the locale policy with pure Dart
        run: dart tools/i18n/test_locale_policy.dart

      - name: Validate workflow syntax and preflight order
        run: python tools/i18n/test_ci.py

      - name: Patch UI consumers of constant data
        run: python tools/i18n/patch_ui.py ../zh

      - name: Apply the codemod
        run: python tools/i18n/codemod.py ../zh

      - name: Wire up app-level locale handling
        run: python tools/i18n/patch_app.py ../zh

      - name: Translate
        id: translate
        env:
          I18N_LLM_API_KEY: ${{ secrets.I18N_LLM_API_KEY }}
          I18N_LLM_BASE_URL: ${{ vars.I18N_LLM_BASE_URL }}
          I18N_LLM_MODEL: ${{ vars.I18N_LLM_MODEL }}
        run: |
          set -euo pipefail
          args=(--repo ../zh --min-coverage 0)
          if [[ "${{ inputs.force_retranslate }}" == "true" ]]; then
            args+=(--refresh)
          fi
          python tools/i18n/translate.py "${args[@]}"

          coverage="$(python -c "import json;print(json.load(open('../zh/i18n/translation-report.json'))['coverage'])")"
          echo "coverage=$coverage" >> "$GITHUB_OUTPUT"

          if python -c "import sys;sys.exit(0 if float('$coverage') >= float('$MIN_COVERAGE') else 1)"; then
            echo "词条翻译率 ${coverage}%。"
          else
            echo "::warning title=词条翻译率偏低::当前 ${coverage}%，并非全界面覆盖率；请检查机翻模型和 translation-report.json。"
          fi

      - name: Generate the Dart lookup table
        run: python tools/i18n/gen_table.py --repo ../zh

      - name: Verify the generated Dart with the official AST
        run: python tools/i18n/verify.py ../zh --app-lib apps/weblibre/lib

      - name: Require a byte-identical no-op codemod
        run: python tools/i18n/ci_checks.py idempotency ../zh

      - name: Copy this run's tooling into the generated tree
        run: |
          set -euo pipefail
          mkdir -p ../zh/tools/i18n
          # 同步源码和 pubspec.lock；绝不复制 SDK、AST 编译缓存或临时测试脚本。
          rsync -a --delete --delete-excluded \
            --exclude='__pycache__/' --exclude='.dart_tool/' \
            --exclude='_t_const.py' --exclude='*.pyc' \
            tools/i18n/ ../zh/tools/i18n/

      - name: Push the generated branch
        id: push_zh
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          set -euo pipefail
          cd ../zh
          git config user.name "weblibre-zh bot"
          git config user.email "weblibre-zh@users.noreply.github.com"
          git add -A
          generated_tree="$(git write-tree)"
          remote_ref="$(git ls-remote --heads origin "refs/heads/${OUTPUT_BRANCH}")"
          previous_sha="${remote_ref%%[[:space:]]*}"
          previous_tree=""
          if [[ -n "$previous_sha" ]]; then
            git fetch --no-tags origin "$previous_sha"
            previous_tree="$(git rev-parse "${previous_sha}^{tree}")"
          fi
          if [[ "$generated_tree" == "$previous_tree" ]]; then
            generated_sha="$previous_sha"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "生成树与远端 ${OUTPUT_BRANCH} 完全一致，复用 $generated_sha。"
          else
            # 内容来自干净上游，父提交沿用远端 zh；无需强推任何分支。
            generated_sha="$(git commit-tree "$generated_tree" \
              -p "${previous_sha:-$UPSTREAM_SHA}" \
              -m "zh: localise ${UPSTREAM_REPO}@${UPSTREAM_SHA:0:12}")"
            git push origin "${generated_sha}:refs/heads/${OUTPUT_BRANCH}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "generated_sha=$generated_sha" >> "$GITHUB_OUTPUT"

      - name: Persist the translation cache
        # 缓存只是优化；失败不能阻断本次构建。非 main 手动运行不回写 main。
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          set -uo pipefail
          if ! mkdir -p i18n || ! cp ../zh/i18n/zh.json i18n/zh.json; then
            echo "::warning title=缓存未保存::无法复制词条缓存，本次构建不受影响。"
            exit 0
          fi
          git config user.name "weblibre-zh bot"
          git config user.email "weblibre-zh@users.noreply.github.com"
          if ! git add -- i18n/zh.json; then
            echo "::warning title=缓存未保存::无法暂存词条缓存，本次构建不受影响。"
            exit 0
          fi
          if git diff --cached --quiet; then
            echo "Translation cache unchanged."
            exit 0
          fi
          if ! git commit -m "i18n: update translation cache [skip ci]"; then
            echo "::warning title=缓存未保存::缓存提交失败，本次构建不受影响。"
            exit 0
          fi
          # checkout 可处于 detached HEAD，因此必须显式推送 HEAD:main。
          for attempt in 1 2 3; do
            if git fetch --no-tags origin main && git rebase origin/main && git push origin HEAD:refs/heads/main; then
              echo "Translation cache persisted (attempt ${attempt})."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "attempt ${attempt} failed; retrying"
          done
          echo "::warning title=缓存未保存::无法将缓存推送至 main，下轮可能重新翻译，本次构建不受影响。"
          exit 0

      - name: Job summary
        if: always()
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          GENERATED_SHA: ${{ steps.push_zh.outputs.generated_sha }}
          CHANGED: ${{ steps.push_zh.outputs.changed }}
          COVERAGE: ${{ steps.translate.outputs.coverage }}
        run: |
          {
            echo "## WebLibre 中文版"
            echo ""
            echo "| 项目 | 结果 |"
            echo "|---|---|"
            echo "| 上游版本 | \`${UPSTREAM_REPO}@${UPSTREAM_SHA}\` |"
            echo "| 生成提交 | \`${GENERATED_SHA}\` |"
            echo "| zh 分支有更新 | ${CHANGED} |"
            echo "| 词条翻译率（非全界面率） | ${COVERAGE}% |"
            echo ""
            if [[ -f ../zh/i18n/translation-report.json ]]; then
              echo '```json'
              python -c "import json;d=json.load(open('../zh/i18n/translation-report.json'));print(json.dumps({k:v for k,v in d.items() if k!='failed'},indent=1,ensure_ascii=False))"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: translate
    # 自动事件总是构建，确保无发布或上轮失败时能重试；手动 false 必须生效。
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_apk }}
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.translate.outputs.generated_sha }}
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "${{ env.FLUTTER_VERSION }}"
          cache: true

      - name: Bootstrap the workspace
        id: bootstrap
        continue-on-error: true
        run: |
          set -euo pipefail
          {
            dart pub global activate melos "${MELOS_VERSION}"
            melos bootstrap
          } 2>&1 | tee "${RUNNER_TEMP}/bootstrap.log"

      - name: Analyze translated Flutter sources before native builds
        id: analyze
        if: steps.bootstrap.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings apps/weblibre/lib \
            2>&1 | tee "${RUNNER_TEMP}/analyze.log"

      - name: Test translated UI consumers before native builds
        id: i18n_smoke
        if: steps.bootstrap.outcome == 'success' && steps.analyze.outcome == 'success'
        continue-on-error: true
        working-directory: apps/weblibre
        run: |
          set -euo pipefail
          # These smoke widgets do not load application assets.
          flutter test --no-pub --no-test-assets test/i18n_smoke_test.dart \
            2>&1 | tee "${RUNNER_TEMP}/i18n-smoke.log"

      - name: Surface preflight errors
        if: steps.bootstrap.outcome == 'failure' || steps.analyze.outcome == 'failure' || steps.i18n_smoke.outcome == 'failure'
        run: |
          python3 tools/i18n/ci_checks.py annotate --title 'Flutter 预检失败' \
            "${RUNNER_TEMP}/bootstrap.log" "${RUNNER_TEMP}/analyze.log" "${RUNNER_TEMP}/i18n-smoke.log"

      - name: Stop before native builds if preflight failed
        if: steps.bootstrap.outcome == 'failure' || steps.analyze.outcome == 'failure' || steps.i18n_smoke.outcome == 'failure'
        run: |
          echo "Flutter 预检失败；请查看 annotation，不再执行 NDK/Go 构建。" >&2
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"

      - name: Fetch external assets
        run: melos run update-assets --no-select

      - name: Build JS components and databases
        run: melos run build-components --no-select

      - uses: actions/setup-go@v5
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: false

      - name: Install Android NDK
        run: |
          set -euo pipefail
          ANDROID_NDK_VERSION="$(
            sed -n 's/^weblibre\.ndkVersion[[:space:]]*=[[:space:]]*//p' \
              apps/weblibre/android/gradle.properties
          )"
          if [[ -z "$ANDROID_NDK_VERSION" ]]; then
            echo "Missing weblibre.ndkVersion in gradle.properties" >&2
            exit 1
          fi
          # `yes` feeds the licence prompt. It MUST be piped with pipefail
          # temporarily disabled: sdkmanager stops reading once it has its
          # answer, `yes` then dies of SIGPIPE (141), and pipefail would report
          # the whole pipeline as failed even though the install succeeded.
          # Upstream does exactly this; check the exit code of sdkmanager
          # (PIPESTATUS[1]) rather than of the pipeline.
          set +e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION"
          sdkmanager_status=${PIPESTATUS[1]}
          set -e
          if [[ $sdkmanager_status -ne 0 ]]; then
            exit "$sdkmanager_status"
          fi
          test -f "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/source.properties"
          {
            echo "ANDROID_NDK_VERSION=$ANDROID_NDK_VERSION"
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
            echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
            echo "NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          } >> "$GITHUB_ENV"

      - name: Select signing mode
        id: signing_mode
        env:
          KEY_JKS: ${{ secrets.KEY_JKS }}
        run: |
          if [[ -n "${KEY_JKS:-}" ]]; then
            echo "test_key=false" >> "$GITHUB_OUTPUT"
          else
            echo "test_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore the test signing key
        id: test_signing_cache
        if: steps.signing_mode.outputs.test_key == 'true'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: weblibre-zh-test-signing-v1

      - name: Prepare signing key
        env:
          KEY_JKS: ${{ secrets.KEY_JKS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -n "${KEY_JKS:-}" ]]; then
            echo "$KEY_JKS" | base64 -di > apps/weblibre/key.jks
            chmod 600 apps/weblibre/key.jks
            {
              echo "KEY_PATH=${GITHUB_WORKSPACE}/apps/weblibre/key.jks"
              echo "KEY_PASSWORD=${KEY_PASSWORD}"
              echo "KEY_ALIAS=${KEY_ALIAS}"
            } >> "$GITHUB_ENV"
            echo "使用 secrets 配置的签名密钥。"
          else
            mkdir -p "$HOME/.android"
            if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
              keytool -genkeypair -keystore "$HOME/.android/debug.keystore" \
                -storetype JKS -storepass android -keypass android -alias AndroidDebugKey \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
            chmod 600 "$HOME/.android/debug.keystore"
            {
              echo "KEY_PATH=$HOME/.android/debug.keystore"
              echo "KEY_PASSWORD=android"
              echo "KEY_ALIAS=AndroidDebugKey"
            } >> "$GITHUB_ENV"
            echo "::warning title=测试签名::缓存失效后密钥可能改变，需要卸载重装；正式使用请配置 KEY_JKS、KEY_PASSWORD、KEY_ALIAS secrets。"
          fi

      - name: Save the test signing key cache
        if: steps.signing_mode.outputs.test_key == 'true' && steps.test_signing_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: weblibre-zh-test-signing-v1

      - name: Cache Go build dependencies
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          # 新命名空间不恢复旧缓存中的跨版本 gomobile/gobind 可执行文件。
          key: ${{ runner.os }}-go-mod-build-${{ env.GO_VERSION }}-${{ hashFiles('native/go_mobile_runtime/pins.env') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-build-${{ env.GO_VERSION }}-

      - name: Check out native runtime sources
        run: |
          set -euo pipefail
          source native/go_mobile_runtime/pins.env

          git clone https://github.com/SagerNet/sing-box.git "$RUNNER_TEMP/sing-box"
          git -C "$RUNNER_TEMP/sing-box" checkout "$SING_BOX_TAG"
          test "$(git -C "$RUNNER_TEMP/sing-box" rev-parse HEAD)" = "$SING_BOX_COMMIT"

          git clone https://github.com/tladesignz/IPtProxy.git "$RUNNER_TEMP/IPtProxy"
          git -C "$RUNNER_TEMP/IPtProxy" checkout "$IPTPROXY_TAG"
          test "$(git -C "$RUNNER_TEMP/IPtProxy" rev-parse HEAD)" = "$IPTPROXY_COMMIT"
          git -C "$RUNNER_TEMP/IPtProxy" submodule update --init dnstt

      - name: Build native gomobile runtime
        env:
          SING_BOX_SOURCE: ${{ runner.temp }}/sing-box
          IPTPROXY_SOURCE: ${{ runner.temp }}/IPtProxy
        run: melos run build-go-runtime --no-select

      - name: Build APKs
        id: build_apk
        continue-on-error: true
        working-directory: apps/weblibre
        run: |
          set -euo pipefail
          echo "version_code=$((1000000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          flutter build apk --release --flavor alpha \
            --target-platform android-arm,android-arm64,android-x64 --split-per-abi --no-tree-shake-icons \
            --build-number="$((1000000 + GITHUB_RUN_NUMBER))" 2>&1 | tee "${RUNNER_TEMP}/build.log"

      - name: Surface build errors
        if: steps.build_apk.outcome == 'failure'
        run: python3 tools/i18n/ci_checks.py annotate --title 'APK 构建失败' "${RUNNER_TEMP}/build.log"

      - name: Fail the job if the build failed
        if: steps.build_apk.outcome == 'failure'
        run: |
          echo "The APK build failed; see the annotation above." >&2
          exit 1

      - name: Verify APK signatures and prepare release checksums
        working-directory: apps/weblibre/build/app/outputs/apk/alpha/release
        env:
          UPSTREAM_SHA: ${{ needs.translate.outputs.upstream_sha }}
          GENERATED_SHA: ${{ needs.translate.outputs.generated_sha }}
          BASE_VERSION_CODE: ${{ steps.build_apk.outputs.version_code }}
          COVERAGE: ${{ needs.translate.outputs.coverage }}
          TEST_SIGNING: ${{ steps.signing_mode.outputs.test_key }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(*.apk)
          if [[ ${#apks[@]} -ne 3 ]]; then
            echo "::error title=APK 产物缺失::预期 3 个 ABI 的 APK，实际 ${#apks[@]} 个。"
            exit 1
          fi
          signers=("$ANDROID_HOME"/build-tools/*/apksigner)
          if [[ ${#signers[@]} -eq 0 ]]; then
            echo "::error title=签名校验失败::Android SDK 中没有 apksigner。"
            exit 1
          fi
          apksigner="$(printf '%s\n' "${signers[@]}" | sort -V | tail -n 1)"
          aapt="${apksigner%/apksigner}/aapt"
          test -x "$apksigner"
          test -x "$aapt"
          for apk in "${apks[@]}"; do
            "$apksigner" verify --verbose "$apk"
          done
          sha256sum "${apks[@]}" > SHA256SUMS.txt
          {
            echo "自动生成的中文测试版（prerelease）。"
            echo ""
            echo "* upstreamSHA: \`${UPSTREAM_REPO}@${UPSTREAM_SHA}\`"
            echo "* generatedSHA: \`${GENERATED_SHA}\`"
            echo "* 基础 versionCode / Flutter build-number: \`${BASE_VERSION_CODE}\`"
            echo "* 词条翻译率：${COVERAGE}%，不是全界面覆盖率，不代表所有页面均已汉化。"
            echo "* 语言跟随系统；APK 按 ABI 拆分，请选择设备对应架构。"
            if [[ "$TEST_SIGNING" == 'true' ]]; then
              echo "* 签名：缓存的 AndroidDebugKey，仅用于测试。缓存失效可能改变签名并需要卸载重装；正式使用请配置 KEY_JKS、KEY_PASSWORD、KEY_ALIAS secrets。"
            else
              echo "* 签名：使用仓库 secrets 配置的密钥。"
            fi
            echo ""
            echo "### APK 实际 versionCode（含上游 ABI 编码）"
            for apk in "${apks[@]}"; do
              badging="$("$aapt" dump badging "$apk")"
              version_code="$(sed -n "s/^package:.* versionCode='\([0-9][0-9]*\)'.*/\1/p" <<< "$badging")"
              if [[ ! "$version_code" =~ ^[0-9]+$ ]]; then
                echo "::error title=产物校验失败::无法读取 ${apk} 的 versionCode。" >&2
                exit 1
              fi
              printf '* `%s`: `%s`\n' "$apk" "$version_code"
            done
            echo ""
            echo "### SHA-256"
            echo '```text'
            cat SHA256SUMS.txt
            echo '```'
          } > "${RUNNER_TEMP}/release-notes.md"
          cat "${RUNNER_TEMP}/release-notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs and checksums
        uses: actions/upload-artifact@v4
        with:
          name: weblibre-zh-apk
          path: |
            apps/weblibre/build/app/outputs/apk/alpha/release/*.apk
            apps/weblibre/build/app/outputs/apk/alpha/release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Point the rolling tag at the exact generated commit
        env:
          GENERATED_SHA: ${{ needs.translate.outputs.generated_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GENERATED_SHA"
          git tag -f zh-latest "$GENERATED_SHA"
          # 仅滚动标签允许强推，不强推 main 或其他分支。
          git push --force origin refs/tags/zh-latest:refs/tags/zh-latest

      - name: Publish a rolling release
        uses: ncipollo/release-action@v1.17.0
        with:
          tag: zh-latest
          commit: ${{ needs.translate.outputs.generated_sha }}
          name: "WebLibre 中文版 (rolling)"
          bodyFile: ${{ runner.temp }}/release-notes.md
          artifacts: "apps/weblibre/build/app/outputs/apk/alpha/release/*.apk,apps/weblibre/build/app/outputs/apk/alpha/release/SHA256SUMS.txt"
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          prerelease: true
          makeLatest: false

      - name: Cleanup
        if: always()
        run: rm -f apps/weblibre/key.jks
